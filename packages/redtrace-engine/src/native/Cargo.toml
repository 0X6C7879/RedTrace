[package]
name = "redtrace_native"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"
strip = "symbols"

[workspace]
