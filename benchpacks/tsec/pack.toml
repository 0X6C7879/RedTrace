schema = 1

id = "tsec"
name = "TSec Benchmark"
version = "1.0.0"
description = "TSec Benchmark 平台接入包"

[adapter]
module = "adapter.py"
class = "TSecAdapter"

[skill]
entrypoint = "SKILL.md"
name = "tsec-benchmark"

[python]
requires = ">=3.9"
dependencies = [
    "tsec-benchmark",
    "httpx"
]

[credentials]
config_file = "config.local.toml"
required = [
    "platform.base_url",
    "platform.token"
]

[capabilities]
list_tasks = true
start_task = true
submit_answer = true
get_hint = true
close_task = true
resume = true

[answer]
type = "flag"
pattern = "^flag\\{[^\\r\\n]{1,500}\\}$"
multiple = true

[runtime]
state_file = "state.json"
close_task_on_completion = true
close_task_on_runner_exit = false
delete_runtime_on_exit = false
delete_results_on_exit = false
