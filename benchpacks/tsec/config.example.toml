[platform]
base_url = "https://benchmark.example.com"
token = "请替换为实际 BENCHMARK_TOKEN"

[run]
parallel_tasks = 1
skip_completed = true
allow_hint = false
max_wrong_submissions = 5
poll_interval_seconds = 2
task_timeout_seconds = 21600

[redtrace]
mode = "docker"
base_url = "http://127.0.0.1:8000"
dispatch_config = "redtrace.yaml"
worker_language = "zh-CN"

[container]
close_on_completed = true
close_on_failure = true
close_on_user_stop = true

[output]
directory = "results"
retain_logs = true
retain_state = true
