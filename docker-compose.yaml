services:
  redtrace:
    build:
      context: .
      dockerfile: Dockerfile
    image: redtrace-app
    ports:
      - "8000:8000"
    volumes:
      - ${REDTRACE_CONFIG_FILE:-${REDTRACE_DISPATCH_CONFIG_FILE:-./redtrace.yaml}}:/redtrace/redtrace.yaml:ro
      - ./.redtrace-secrets:/redtrace/.redtrace-secrets:ro
      - ./skills:/redtrace/skills
      - ./mcp:/redtrace/mcp
      - ./.redtrace:/redtrace/.redtrace
      - ./workspaces:/redtrace/workspaces
      - ./output:/redtrace/output
      - type: bind
        source: ${REDTRACE_USER_HOME:-${HOME:-${USERPROFILE}}}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${REDTRACE_USER_HOME:-${HOME:-${USERPROFILE}}}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${REDTRACE_USER_HOME:-${HOME:-${USERPROFILE}}}/.pi
        target: /root/.pi
        read_only: true
        bind:
          create_host_path: false
    environment:
      REDTRACE_ROOT: /redtrace
      REDTRACE_DATA_ROOT: /redtrace/.redtrace
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
