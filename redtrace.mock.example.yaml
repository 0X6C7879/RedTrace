# Deterministic mock deployment for development and automated tests.
runtime:
  max_workers: 4
  max_running_projects: 2
  max_project_workers: 4

tasks:
  bootstrap:
    timeout: 9
    conclude_timeout: 5
  reason:
    timeout: 5
    conclude_timeout: 5
    max_intents: 5
  explore:
    timeout: 9
    conclude_timeout: 5

workers:
  - name: "mock-observer-1"
    provider: "mock"
    max_running: 1
    priority: 0

  - name: "mock-observer-2"
    provider: "mock"
    max_running: 1
    priority: 0
