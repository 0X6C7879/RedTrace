# Deterministic mock deployment for development and automated tests.
runtime:
  max_workers: 4
  max_running_projects: 2
  max_project_workers: 4

tasks:
  commander: { timeout: 300, conclude_timeout: 30, max_intents: 4 }
  general: { timeout: 1800, conclude_timeout: 300 }
  soldier: { timeout: 1800, conclude_timeout: 300 }
  scout: { timeout: 240, conclude_timeout: 30 }

workers:
  - name: "mock-observer-1"
    provider: "mock"
    roles: [general, soldier, scout]
    max_running: 1
    priority: 0

  - name: "mock-observer-2"
    provider: "mock"
    max_running: 1
    priority: 0
