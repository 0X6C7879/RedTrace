# Pi-only Cairn benchmark configuration. Copy to dispatch.yaml and replace placeholders.
server: "http://127.0.0.1:8000"

runtime:
  execution: local
  interval: 3
  max_workers: 4
  max_running_projects: 1
  max_project_workers: 4
  healthcheck_timeout: 60
  worker_healthcheck: startup_only
  prompt_group: default

tasks:
  bootstrap:
    timeout: 600
    conclude_timeout: 120
  reason:
    timeout: 300
    max_intents: 3
  explore:
    timeout: 1800
    conclude_timeout: 300

local:
  completed_action: keep

common_env:
  BENCHMARK_TOKEN: "replace-me"
  BENCHMARK_BASE_URL: "https://tsecbench.zc.tencent.com"
  VPN_CHECK_URL: "http://10.0.100.58"
  PI_CODING_AGENT_DIR: "/absolute/path/to/RedTrace_X/container/.pi/agent"

workers:
  - name: pi-coordinator
    type: pi
    task_types: [bootstrap, reason]
    max_running: 1
    priority: 0
    env: &pi_gateway
      PI_BASE_URL: "https://agent-awd.baidu.com/v1"
      PI_MODEL: "glm-5.2-agent-chanllenge"
      PI_API_KEY: "replace-me"
      PI_PROVIDER_API: openai-completions

  - name: pi-explore-1
    type: pi
    task_types: [explore]
    max_running: 1
    priority: 0
    env: *pi_gateway

  - name: pi-explore-2
    type: pi
    task_types: [explore]
    max_running: 1
    priority: 0
    env: *pi_gateway

  - name: pi-explore-3
    type: pi
    task_types: [explore]
    max_running: 1
    priority: 0
    env: *pi_gateway
