name: DSH mainline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --project redtrace --locked --group dev
      - run: npm run dsh:check-revision
      - run: npm run dsh:install
      - run: npm run dsh:build
      - run: npm run dsh:test
      - run: npm run dsh:probe
      - run: uv run --project redtrace pytest -q redtrace/tests
      - if: runner.os == 'Windows'
        run: cmd /d /c start-redtrace.cmd --help
      - if: runner.os != 'Windows'
        run: bash ./start-redtrace.sh --help
