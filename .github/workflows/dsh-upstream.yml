name: DSH upstream upgrade

# Weekly drift check against the pinned DeepSeek Harness revision. When
# upstream moved, open an upgrade PR (submodule pointer + pin). The PR runs
# the regular three-platform `dsh-mainline` CI; merge only after it passes.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check for an upstream revision drift
        id: drift
        run: |
          if node scripts/upgrade-dsh.mjs --check; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Update the submodule and pin
        if: steps.drift.outputs.available == 'true'
        run: node scripts/upgrade-dsh.mjs
      - name: Open the upgrade pull request
        if: steps.drift.outputs.available == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/dsh-upstream-upgrade
          title: "chore: upgrade DSH harness upstream"
          body: |
            Scheduled DSH upstream drift check found a new revision.

            - The submodule pointer and the revision pin in
              `scripts/check-dsh-revision.mjs` are updated together.
            - The regular `DSH mainline` three-platform CI validates this PR;
              merge only after Windows/macOS/Linux all pass.
          commit-message: "chore: upgrade DSH harness upstream revision"
          delete-branch: true
