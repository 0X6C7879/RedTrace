# Local execution example — workers directly invoke the host claude / codex / pi CLIs.
# This file uses RedTrace's 1M-context long-task profile. A complete per-Worker
# Endpoint + API Key + Model override takes precedence for only that process.
# If all three are omitted, the CLI's existing login and global config are used.
# HOME and each CLI's user config directory are preserved in both cases.
#
# Usage:
#   cp dispatch.local.example.yaml dispatch.yaml
#   uv run --project redtrace redtrace serve                       # in one shell
#   uv run --project redtrace redtrace dispatch --config dispatch.yaml
#
# Notes:
# - Do NOT run the dispatcher via docker-compose in local mode: it must run on the host
#   where the CLIs are installed, logged in, and on PATH. The server may still run anywhere.
# - Local mode runs the agents with your user's permissions and no sandbox. Only use it in
#   environments you are authorized to operate in.
# - Timeouts below are hard wall-clock limits for one Agent CLI phase, not inactivity timers.

server: "http://127.0.0.1:8000"

runtime:
  execution: local              # run workers as host processes instead of per-project containers
  worker_healthcheck: disabled  # startup checks only verify that the native CLIs are on PATH
  max_workers: 3                # all workers share this host — size to the machine
  max_running_projects: 2
  max_project_workers: 3
  interval: 3
  healthcheck_timeout: 60
  prompt_group: "default"

tasks:
  bootstrap:
    # Initial direct attempt may solve the complete target before graph decomposition.
    timeout: 7200               # 2 hours
    conclude_timeout: 1800      # 30 minutes to preserve confirmed progress
  reason:
    timeout: 1800               # 30 minutes for full-graph planning
    max_intents: 3
  explore:
    timeout: 14400              # 4 hours for long-running investigation/tool chains
    conclude_timeout: 1800      # 30 minutes to recover a usable conclusion

context_harness:
  enabled: true
  artifact_root: ".redtrace/artifacts/context"
  # 1M-context profile: retain useful medium outputs directly, while keeping very
  # large scanner/browser output as queryable Artifacts instead of losing it.
  inline_bytes: 262144          # 256 KiB; roughly 65K tokens at the harness estimator
  visible_bytes: 131072         # up to 128 KiB of deterministic high-signal summary
  query_bytes: 1048576          # up to 1 MiB per bounded Artifact query
  parse_bytes: 67108864         # inspect/sample up to 64 MiB while raw files remain complete
  worker_output_chars: 33554432 # retain a 32 Mi-character prefix+tail window per stream

# Optional. If omitted: workspace_root defaults to the dispatcher's current directory,
# completed_action defaults to keep. Each project gets an isolated <workspace_root>/<project_id>/.
local:
  # workspace_root: "/data/redtrace-runs"
  completed_action: keep       # keep | remove

# Extra environment variables for every local worker process. These are merged over the
# dispatcher's own environment ({**os.environ, **common_env}), so use it for things the
# CLIs need at runtime, e.g. an outbound proxy. (Alternatively just `export` them in the
# shell that starts the dispatcher — local workers inherit that environment.)
# common_env:
#   https_proxy: "http://127.0.0.1:7897"
#   http_proxy: "http://127.0.0.1:7897"
#   all_proxy: "http://127.0.0.1:7897"

# Per-worker `env:` overrides common_env and the host environment. API configuration must
# be either complete or entirely absent; partial overrides are rejected at startup.
workers:
  - name: "local-claude"
    type: "claudecode"
    enabled: true
    task_types: [bootstrap, reason, explore]
    max_running: 1
    priority: 0
    # env:
