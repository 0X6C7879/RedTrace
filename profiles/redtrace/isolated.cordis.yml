- id: web-server
  name: '../../vendor/deepseek-harness/packages/host/webserver/lib/index.js'
  config:
    host: 127.0.0.1
    port: 0

- id: llm-deepseek
  name: '../../vendor/deepseek-harness/packages/llm/llm-deepseek/lib/index.js'

- id: token-meter
  name: '../../vendor/deepseek-harness/packages/llm/token-meter/lib/index.js'

- id: compaction-basic
  name: '../../vendor/deepseek-harness/packages/compaction/compaction-basic/lib/index.js'

- id: subprocess
  name: '../../vendor/deepseek-harness/packages/subprocess/subprocess-local/lib/index.js'

- id: sandbox
  name: '../../vendor/deepseek-harness/packages/sandbox/sandbox-local/lib/index.js'

- id: sandbox-policy
  name: '../../vendor/deepseek-harness/packages/sandbox/sandbox-policy/lib/index.js'
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: shell
  name: '../../vendor/deepseek-harness/packages/shell/bash-sandbox/lib/index.js'
  disabled: !!js process.platform === 'win32'

- id: shell-windows
  name: '../../vendor/deepseek-harness/packages/shell/pwsh-sandbox/lib/index.js'
  disabled: !!js process.platform !== 'win32'

- id: approval
  name: '../../vendor/deepseek-harness/packages/interaction/user-approval/lib/index.js'
  config:
    policy: never

- id: shell-env
  name: '../../vendor/deepseek-harness/packages/shell/shell-env/lib/index.js'

- id: tool-shell
  name: '../../vendor/deepseek-harness/packages/shell/tool-bash/lib/index.js'
  disabled: !!js process.platform === 'win32'

- id: tool-shell-windows
  name: '../../vendor/deepseek-harness/packages/shell/tool-pwsh/lib/index.js'
  disabled: !!js process.platform !== 'win32'

- id: fs-sandbox
  name: '../../vendor/deepseek-harness/packages/fs/fs-sandbox/lib/index.js'

- id: fs-observation-policy
  name: '../../vendor/deepseek-harness/packages/fs/fs-observation-policy/lib/index.js'

- id: tool-fs
  name: '../../vendor/deepseek-harness/packages/fs/tool-fs/lib/index.js'

- id: skill
  name: '../../vendor/deepseek-harness/packages/skill/skill/lib/index.js'

- id: skill-filesystem
  name: '../../vendor/deepseek-harness/packages/skill/skill-filesystem/lib/index.js'
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js process.env.REDTRACE_SKILLS_DIR

- id: tool-skill
  name: '../../vendor/deepseek-harness/packages/skill/tool-skill/lib/index.js'

- id: sessions
  name: '../../vendor/deepseek-harness/packages/session/session-persistence-jsonl/lib/index.js'
  config:
    root: !!js process.env.DSH_SESSION_ROOT
    compression: none

- id: session-checkpoints
  name: '../../vendor/deepseek-harness/packages/session/session-checkpoint-policy/lib/index.js'

- id: redtrace-core
  name: '../../packages/redtrace-dsh/lib/core.js'

# Explore tool permissions: sandboxed toolchain plus contract and shared
# resource tools (task type comes from REDTRACE_TASK_TYPE).
- id: redtrace-contracts
  name: '../../packages/redtrace-dsh/lib/contracts.js'

- id: redtrace-resource
  name: '../../packages/redtrace-dsh/lib/resource.js'
