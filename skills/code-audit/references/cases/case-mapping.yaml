# 漏洞类型映射配置
# 用于将 vulnerabilities.db 中的 vul_type_id 映射到案例文档

# 主要漏洞类型映射（内部案例数 >= 100）
mappings:
  # IDOR越权访问
  - vul_type_ids: [32, 31]  # IDOR + 垂直越权
    case_file: idor-cases.md
    wooyun_file: unauthorized-access.md
    min_internal: 10
    min_wooyun: 10

  # SQL注入
  - vul_type_ids: [17]
    case_file: sqli-cases.md
    wooyun_file: sql-injection.md
    min_internal: 10
    min_wooyun: 15

  # XSS跨站脚本
  - vul_type_ids: [18, 19]  # XSS + 反射型XSS
    case_file: xss-cases.md
    wooyun_file: xss.md
    min_internal: 10
    min_wooyun: 10

  # 远程命令执行
  - vul_type_ids: [21]
    case_file: rce-cases.md
    wooyun_files: [rce.md, command-execution.md]
    min_internal: 10
    min_wooyun: 15

  # SSRF
  - vul_type_ids: [30]
    case_file: ssrf-cases.md
    wooyun_file: ssrf.md
    min_internal: 10
    min_wooyun: 10

  # 文件上传
  - vul_type_ids: [27]
    case_file: file-upload-cases.md
    wooyun_file: file-upload.md
    min_internal: 10
    min_wooyun: 10

  # 未授权访问
  - vul_type_ids: [35]
    case_file: unauthorized-cases.md
    wooyun_file: unauthorized-access.md
    min_internal: 10
    min_wooyun: 10

  # 信息泄露
  - vul_type_ids: [36]
    case_file: info-disclosure-cases.md
    wooyun_file: info-disclosure.md
    min_internal: 10
    min_wooyun: 10

  # 逻辑漏洞
  - vul_type_ids: [33]
    case_file: logic-flaws-cases.md
    wooyun_file: logic-flaws.md
    min_internal: 10
    min_wooyun: 10

  # 弱口令
  - vul_type_ids: [34, 15]  # 弱口令 + 暴力破解
    case_file: weak-password-cases.md
    wooyun_file: weak-password.md
    min_internal: 10
    min_wooyun: 10

  # CSRF
  - vul_type_ids: [37]
    case_file: csrf-cases.md
    wooyun_file: csrf.md
    min_internal: 10
    min_wooyun: 10

  # 开放重定向
  - vul_type_ids: [38]
    case_file: open-redirect-cases.md
    wooyun_file: null
    min_internal: 10
    min_wooyun: 0

  # 配置错误
  - vul_type_ids: [67, 66]  # 权限绕过 + 配置缺陷
    case_file: misconfig-cases.md
    wooyun_file: misconfig.md
    min_internal: 10
    min_wooyun: 10

  # LDAP 注入
  - vul_type_ids: [74]
    case_file: ldap-injection-cases.md
    wooyun_file: null
    min_internal: 1
    min_wooyun: 0

  # JDBC URI 注入
  - vul_type_ids: [72]
    case_file: jdbc-injection-cases.md
    wooyun_file: null
    min_internal: 5
    min_wooyun: 0

  # Swagger/OpenAPI 不安全配置（新类型，内部系统尚未分配 vul_type_id，暂留空；暂复用 misconfig 案例文件，待积累专项案例后拆分）
  - vul_type_ids: []
    case_file: misconfig-cases.md
    wooyun_file: null
    min_internal: 0
    min_wooyun: 0

# 仅乌云数据的案例（无内部案例）
wooyun_only:
  - case_file: file-traversal-cases.md
    wooyun_file: file-traversal.md
    min_wooyun: 10

  - case_file: xxe-cases.md
    wooyun_file: xxe.md
    min_wooyun: 10

# 敏感词脱敏规则
desensitize:
  # 系统名称脱敏
  system_names:
    - "磁力罗盘"
    - "墨菲供应链"
    - "发票识别"
    - "财务RPA"
    - "职工书屋"
    - "HR知识库"
  replace_with: "某内部系统"
  
  # 域名脱敏
  domains:
    - "docs.corp.kuaishou.com"
    - "kuaishou.com"
    - "ksapisrv.com"
  replace_with: "internal.example.com"
  
  # 移除内容
  remove_patterns:
    - "<p>.*?</p>"  # HTML标签
    - "https://docs\\.corp\\.kuaishou\\.com/.*"  # 内部文档链接
