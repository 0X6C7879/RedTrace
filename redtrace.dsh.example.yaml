# Native Windows/macOS/Linux DSH execution. Build once with `npm run dsh:install`
# and `npm run dsh:build`; ordinary `redtrace start` does not reinstall packages.
#
# Worker-centric DSH scheduling: every enabled Worker referencing a configured
# provider becomes a runtime Worker carrying its own bootstrap/reason/explore
# eligibility, max_running concurrency cap, priority, and provider/model route.
# The scheduler selects an eligible Worker per task, claims it under the
# Worker's real name, and creates a dedicated DSH Agent + Session. Providers
# and Workers are both editable in the Web UI settings page; edits hot-reload:
# new tasks pick up the new view while running tasks keep the route they
# captured at launch.

server: "http://127.0.0.1:8000"

# Providers own the API protocol, endpoint, credential, and model list. A
# provider may back any number of Workers. Credentials: inline api_key (a
# ${REDTRACE_SECRET:...} reference is resolved from the secret store) or an
# api_key_env name resolved from the launching environment. Each model entry
# carries its own context window (default 1,000,000), output cap (default
# 128,000), and reasoning policy. Omitted reasoning defaults to auto_max:
# DSH selects the highest level the exact model reports. A custom gateway
# model that is absent from DSH's catalog can declare reasoning_efforts.
providers:
  deepseek:
    api: openai-completions
    base_url: https://api.deepseek.com
    api_key: replace-me
    models:
      - id: deepseek-reasoner
        context_window: 1000000
        max_tokens: 128000
        reasoning: auto_max
        reasoning_efforts:
          "off":
          high: high
          max: max
      - id: deepseek-chat
        context_window: 1000000
        max_tokens: 128000
        reasoning_efforts: false

runtime:
  execution: local
  worker_healthcheck: startup_only
  max_workers: 3
  max_running_projects: 2
  max_project_workers: 3
  interval: 3
  healthcheck_timeout: 60
  prompt_group: default

tasks:
  bootstrap:
    timeout: 1800
    conclude_timeout: 300
  reason:
    timeout: 300
    max_intents: 4
  explore:
    timeout: 1800
    conclude_timeout: 300


workers:
- name: reasoner
  enabled: true
  provider: deepseek
  model: deepseek-reasoner
  bootstrap: false
  reason: true
  explore: false
  max_running: 1
  priority: 0
- name: explorer
  enabled: true
  provider: deepseek
  model: deepseek-chat
  bootstrap: false
  reason: false
  explore: true
  max_running: 2
  priority: 1
- name: bootstrapper
  enabled: true
  provider: deepseek
  model: deepseek-chat
  bootstrap: true
  reason: false
  explore: true
  max_running: 1
  priority: 2

paths:
  root: .
  skills: skills
  mcp: mcp
  managed: .redtrace
  workspaces: workspaces
  audit: .redtrace/audit
