# RedTrace server API endpoint.
server: "http://redtrace-server:8000"

# Shared environment variables merged into every worker.
common_env:
  TSEC_SERVER_HOST: "<SERVER_HOST>:8000"
  TSEC_AGENT_TOKEN: "xxx"

runtime:
  # Scheduler tick interval in seconds.
  interval: 3
  # Global concurrency cap across all workers and all projects.
  max_workers: 8
  # Maximum number of projects that may be actively scheduled at the same time.
  max_running_projects: 3
  # Per-project worker cap. Prevents one project from monopolizing the whole dispatcher.
  max_project_workers: 4
  # Slow gateways and cold model backends should not be rejected prematurely.
  healthcheck_timeout: 60
  # "startup_and_task" checks at dispatcher startup and before every task.
  # "startup_only" checks only at startup. "disabled" skips automatic worker checks.
  worker_healthcheck: "startup_only"
  # Prompt set loaded from redtrace/src/redtrace/dispatcher/prompts/.
  prompt_group: "default"

tasks:
  # These are hard wall-clock limits for one Agent CLI phase, not inactivity timers.
  bootstrap:
    # The first high-capability Worker may attempt the complete target before decomposition.
    timeout: 7200               # 2 hours
    # Time budget for conclude fallback after timeout or unusable output.
    conclude_timeout: 1800      # 30 minutes
  reason:
    # Full-graph planning over long histories and large evidence sets.
    timeout: 1800               # 30 minutes
    # Hard cap on how many new intents one reason step may create.
    max_intents: 3
  explore:
    # Long-running security investigation, compilation, scanning and browser/tool chains.
    timeout: 14400              # 4 hours
    # Time budget for preserving confirmed findings from the same session.
    conclude_timeout: 1800      # 30 minutes

context_harness:
  # Shared post-RTK layer for Claude Code, Codex, and Pi. Set false for raw execution.
  enabled: true
  # Complete security/HTTP/Web output is stored inside the task workspace.
  artifact_root: ".redtrace/artifacts/context"
  # 1M-context profile. Medium outputs stay visible; genuinely large output is retained
  # as a complete Artifact with much larger summary, parse and bounded-query budgets.
  inline_bytes: 262144          # 256 KiB; roughly 65K tokens at the harness estimator
  visible_bytes: 131072         # up to 128 KiB of deterministic high-signal summary
  query_bytes: 1048576          # up to 1 MiB per bounded Artifact query
  parse_bytes: 67108864         # inspect/sample up to 64 MiB; raw files remain complete
  # Bounded prefix+tail retained from each outer Worker stdout/stderr stream.
  worker_output_chars: 33554432 # 32 Mi characters per stream

container:
  # Base worker container. The dispatcher execs agent commands inside one container per project.
  image: "ghcr.io/oritera/redtrace-worker-container:latest"
  network_mode: "host"
  # "stop" keeps finished containers for inspection; "remove" is cleaner but loses post-run state.
  completed_action: "stop"
  # Add Linux capabilities only when a task truly needs them, such as packet crafting or network admin actions.
  # cap_add:
  #   - "NET_RAW"
  #   - "NET_ADMIN"

workers:
  # Worker priority is ascending: lower numbers are preferred first.
  # max_running is per-worker concurrency. Slower backends such as Pi usually benefit from lower values.
  - name: "claudecode_deepseek-v4-pro"
    type: "claudecode"
    task_types: [bootstrap, reason, explore]
    max_running: 2
    priority: 0
    env:
      ANTHROPIC_MODEL: "deepseek-v4-pro"
      ANTHROPIC_BASE_URL: "https://api.deepseek.com/anthropic"
      ANTHROPIC_AUTH_TOKEN: "sk-xxx"

