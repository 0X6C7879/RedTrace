# RedTrace container deployment example.
# RedTrace server API endpoint.
server: "http://redtrace-server:8000"

# Shared environment variables merged into every worker.
common_env:
  TSEC_SERVER_HOST: "<SERVER_HOST>:8000"
  TSEC_AGENT_TOKEN: "xxx"
  BRAVE_API_KEY: "replace-me"  # fallback after native Claude/Codex web search

runtime:
  # Docker mode is explicit so this file cannot silently become a host-local deployment.
  execution: "container"
  # Scheduler tick interval in seconds.
  interval: 3
  # Global concurrency cap across all workers and all projects.
  max_workers: 8
  # Maximum number of projects that may be actively scheduled at the same time.
  max_running_projects: 3
  # Per-project worker cap. Prevents one project from monopolizing the whole dispatcher.
  max_project_workers: 4
  # Timeout for each enabled worker healthcheck.
  healthcheck_timeout: 60
  # "startup_and_task" checks at dispatcher startup and before every task.
  # "startup_only" checks only at startup. "disabled" skips automatic worker checks.
  worker_healthcheck: "startup_only"
  # Prompt set loaded from redtrace/src/redtrace/dispatcher/prompts/.
  prompt_group: "default"

tasks:
  bootstrap:
    # Main execution timeout for the initial direct solve attempt.
    timeout: 1800
    # Time budget for conclude fallback after the main phase times out or returns unusable output.
    conclude_timeout: 300
  reason:
    # Reason decides whether the goal is met and whether new intents should be proposed.
    timeout: 300
    # Max new Intents proposed per single Reason call.
    max_intents: 5
  explore:
    # Main execution timeout for exploring a claimed intent.
    timeout: 1800
    # Time budget for conclude fallback used to summarize confirmed findings from the same session.
    conclude_timeout: 300


container:
  # Built locally by docker compose. The dispatcher execs agent commands inside
  # one Kali Linux container per project.
  image: "redtrace-worker-container:latest"
  # Shared named bridge works on Linux Engine and Docker Desktop for Windows/macOS.
  network_mode: "redtrace-network"
  # "stop" keeps finished containers for inspection; "remove" is cleaner but loses post-run state.
  completed_action: "stop"
  # Add Linux capabilities only when a task truly needs them, such as packet crafting or network admin actions.
  # cap_add:
  #   - "NET_RAW"
  #   - "NET_ADMIN"


# Providers own the API protocol, endpoint, credential, and model list;
# Workers reference them by name and add scheduling identity. Each model
# entry carries its own context window, output cap, and thinking format.
providers:
  deepseek-anthropic:
    api: anthropic-messages
    base_url: https://api.deepseek.com/anthropic
    api_key: sk-xxx
    models:
      - id: deepseek-v4-pro
        context_window: 1000000
        max_tokens: 128000
        thinking_format: none
  dashscope:
    api: openai-completions
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: sk-xxx
    models:
      - id: qwen3.6-plus
        context_window: 1000000
        max_tokens: 128000
        thinking_format: openai

workers:
  # Worker priority is ascending: lower numbers are preferred first.
  # max_running is per-worker concurrency. bootstrap/reason/explore gate the
  # task types this Worker may run.
  - name: "claudecode_deepseek-v4-pro"
    provider: "deepseek-anthropic"
    model: "deepseek-v4-pro"
    bootstrap: true
    reason: true
    explore: true
    max_running: 2
    priority: 0

  # - name: "qwen-reasoner"
  #   provider: "dashscope"
  #   model: "qwen3.6-plus"
  #   bootstrap: true
  #   reason: true
  #   explore: true
  #   max_running: 2
  #   priority: 0
paths:
  root: .
  skills: skills
  mcp: mcp
  managed: .redtrace
  workspaces: workspaces
  audit: .redtrace/audit
